name: plugs-dual-metered-outage-children
components:
  - id: main
    capabilities:
      - {id: switch, version: 1}
      - {id: powerMeter, version: 1}
      - {id: energyMeter, version: 1}
      - {id: voltageMeasurement, version: 1}
      - {id: currentMeasurement, version: 1}
      - {id: concertmirror08464.powerPollIntervalV2, version: 1}
      - {id: concertmirror08464.lastPowerResponseTime, version: 1}
      - {id: concertmirror08464.powerOutageMemory, version: 1}
      - {id: refresh, version: 1}
    categories:
      - name: SmartPlug
  - id: switch2
    capabilities:
      - {id: switch, version: 1}
    categories:
      - name: SmartPlug
deviceConfig:
  dashboard:
    states:
      - {component: main, capability: switch, version: 1, group: main, composite: true}
      - component: main
        capability: powerMeter
        version: 1
        group: main
        values:
          - label: " | {{power.value}}{{power.unit}}"
        composite: true
    actions:
      - component: main
        capability: switch
        version: 1
        group: main
        values:
          - command: "on"
          - command: "off"
    basicPlus: []
  detailView:
    - {component: main, capability: switch, version: 1}
    - {component: main, capability: powerMeter, version: 1}
    - {component: main, capability: energyMeter, version: 1}
    - {component: main, capability: voltageMeasurement, version: 1}
    - {component: main, capability: currentMeasurement, version: 1}
    - {component: main, capability: concertmirror08464.powerPollIntervalV2, version: 1}
    - {component: main, capability: concertmirror08464.lastPowerResponseTime, version: 1}
    - {component: main, capability: concertmirror08464.powerOutageMemory, version: 1}
    - {component: main, capability: refresh, version: 1}
    - {component: switch2, capability: switch, version: 1}
  automation:
    conditions:
      - {component: main, capability: switch, version: 1}
      - {component: switch2, capability: switch, version: 1}
      - {component: main, capability: powerMeter, version: 1}
      - {component: main, capability: energyMeter, version: 1}
      - {component: main, capability: voltageMeasurement, version: 1}
      - {component: main, capability: currentMeasurement, version: 1}
      - {component: main, capability: concertmirror08464.powerPollIntervalV2, version: 1}
      - {component: main, capability: concertmirror08464.powerOutageMemory, version: 1}
    actions:
      - {component: main, capability: switch, version: 1}
      - {component: switch2, capability: switch, version: 1}
      - {component: main, capability: concertmirror08464.powerPollIntervalV2, version: 1}
      - {component: main, capability: concertmirror08464.powerOutageMemory, version: 1}
preferences:
  - name: outletChildDevices
    title: Outlet 2 as separate device
    description: Creates a separate device for outlet 2, so Alexa, Google Home and the device Timer can control it on its own.
    required: false
    preferenceType: boolean
    definition:
      default: true
  - name: powerReportChange
    title: Power report threshold (W)
    description: Report power when it changes by at least this many watts. Lower is more responsive but adds history noise. Default 5.
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 100
      default: 5
  - name: currentReportChange
    title: Current report threshold (mA)
    description: Report current when it changes by at least this many milliamps (1000 mA = 1 A). Default 50.
    required: false
    preferenceType: integer
    definition:
      minimum: 10
      maximum: 1000
      default: 50
  - name: voltageReportChange
    title: Voltage report threshold (V)
    description: Report voltage when it changes by at least this many volts. Voltage never reports more than once a minute. Default 3.
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 20
      default: 3
  - name: reportMinInterval
    title: Minimum report interval (s)
    description: Shortest time between power or current reports. Default 5.
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 300
      default: 5
