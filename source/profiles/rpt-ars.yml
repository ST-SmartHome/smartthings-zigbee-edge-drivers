name: rpt-ars
components:
- id: main
  capabilities:
  - id: temperatureMeasurement
    version: 1
  - id: thermostatHeatingSetpoint
    version: 1
    config:
      values:
      - key: heatingSetpoint.value
        range:
        - 8
        - 30
        step: 1
  - id: thermostatCoolingSetpoint
    version: 1
    config:
      values:
      - key: coolingSetpoint.value
        range:
        - 8
        - 30
        step: 1
  - id: thermostatMode
    version: 1
    config:
      values:
      - key: thermostatMode.value
        enabledValues:
        - 'off'
        - heat
        - cool
        - auto
        - dryair
        - fanonly
  - id: concertmirror08464.owonAc201LouverPosition
    version: 1
  - id: refresh
    version: 1
  - id: signalStrength
    version: 1
  - id: concertmirror08464.zclLocalTempReportMin
    version: 1
  - id: concertmirror08464.zclLocalTempReportMax
    version: 1
  - id: concertmirror08464.zclLocalTempReportChange29
    version: 1
  - id: concertmirror08464.zclHeatSetReportMin
    version: 1
  - id: concertmirror08464.zclHeatSetReportMax
    version: 1
  - id: concertmirror08464.zclHeatSetReportChange29
    version: 1
  - id: concertmirror08464.zclModeReportMin
    version: 1
  - id: concertmirror08464.zclModeReportMax
    version: 1
  - id: concertmirror08464.zclFanModeReportMin
    version: 1
  - id: concertmirror08464.zclFanModeReportMax
    version: 1
  - id: concertmirror08464.zclLouverReportMin
    version: 1
  - id: concertmirror08464.zclLouverReportMax
    version: 1
  categories:
  - name: AirConditioner
- id: fan
  label: Fan
  capabilities:
  - id: airConditionerFanMode
    version: 1
    config:
      values:
      - key: fanMode.value
        enabledValues:
        - low
        - medium
        - high
        - 'on'
        - auto
  - id: switch
    version: 1
