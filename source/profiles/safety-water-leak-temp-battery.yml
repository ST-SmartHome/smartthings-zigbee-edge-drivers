name: safety-water-leak-temp-battery
components:
  - id: main
    capabilities:
      - id: waterSensor
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
      - {id: signalStrength, version: 1}
    categories:
      - name: LeakSensor
preferences:
  - preferenceId: tempOffset
    explicit: true
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: waterSensor
      group: main
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: waterSensor
  - component: main
    capability: temperatureMeasurement
  - component: main
    capability: battery
  - component: main
    capability: refresh
  - component: main
    capability: signalStrength
  automation:
    conditions:
    - component: main
      capability: waterSensor
    - component: main
      capability: temperatureMeasurement
    - component: main
      capability: battery
    - component: main
      capability: signalStrength
    actions: []
