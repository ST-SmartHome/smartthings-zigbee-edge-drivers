name: safety-motion-illuminance-temp-humidity-battery
components:
  - id: main
    capabilities:
      - id: motionSensor
        version: 1
      - id: illuminanceMeasurement
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
      - {id: signalStrength, version: 1}
    categories:
      - name: MotionSensor
preferences:
  - preferenceId: tempOffset
    explicit: true
  - preferenceId: humidityOffset
    explicit: true
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: motionSensor
      group: main
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: motionSensor
  - component: main
    capability: illuminanceMeasurement
  - component: main
    capability: temperatureMeasurement
  - component: main
    capability: relativeHumidityMeasurement
  - component: main
    capability: battery
  - component: main
    capability: refresh
  - component: main
    capability: signalStrength
  automation:
    conditions:
    - component: main
      capability: motionSensor
    - component: main
      capability: illuminanceMeasurement
    - component: main
      capability: temperatureMeasurement
    - component: main
      capability: relativeHumidityMeasurement
    - component: main
      capability: battery
    - component: main
      capability: signalStrength
    actions: []
