name: safety-contact-temp-battery
components:
  - id: main
    capabilities:
      - id: contactSensor
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: battery
        version: 1
      - id: refresh
        version: 1
      - {id: signalStrength, version: 1}
    categories:
      - name: ContactSensor
preferences:
  - preferenceId: tempOffset
    explicit: true
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: contactSensor
      group: main
      composite: true
    - component: main
      capability: temperatureMeasurement
      group: main
      values:
      - label: ' {{temperature.value}}{{temperature.unit}}'
      composite: true
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: contactSensor
  - component: main
    capability: temperatureMeasurement
  - component: main
    capability: battery
  - component: main
    capability: refresh
  - component: main
    capability: signalStrength
  automation:
    conditions:
    - component: main
      capability: contactSensor
    - component: main
      capability: temperatureMeasurement
    - component: main
      capability: battery
    - component: main
      capability: signalStrength
    actions: []
