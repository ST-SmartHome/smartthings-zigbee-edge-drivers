name: sensors-illuminance-temp-humidity
components:
- id: main
  capabilities:
  - id: illuminanceMeasurement
    version: 1
  - id: temperatureMeasurement
    version: 1
  - id: relativeHumidityMeasurement
    version: 1
  - id: firmwareUpdate
    version: 1
  - id: refresh
    version: 1
  - {id: signalStrength, version: 1}
  categories:
  - name: TempHumiditySensor
preferences:
  - preferenceId: tempOffset
    explicit: true
  - preferenceId: humidityOffset
    explicit: true
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: illuminanceMeasurement
      group: main
      composite: true
    - component: main
      capability: temperatureMeasurement
      group: main
      values:
      - label: ' {{temperature.value}}{{temperature.unit}}'
      composite: true
    - component: main
      capability: relativeHumidityMeasurement
      group: main
      values:
      - label: ' {{humidity.value}}{{humidity.unit}}'
      composite: true
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: illuminanceMeasurement
  - component: main
    capability: temperatureMeasurement
  - component: main
    capability: relativeHumidityMeasurement
  - component: main
    capability: refresh
  - component: main
    capability: signalStrength
  automation:
    conditions:
    - component: main
      capability: illuminanceMeasurement
    - component: main
      capability: temperatureMeasurement
    - component: main
      capability: relativeHumidityMeasurement
    - component: main
      capability: signalStrength
    actions: []
