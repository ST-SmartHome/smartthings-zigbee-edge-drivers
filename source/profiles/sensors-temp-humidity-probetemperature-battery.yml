name: sensors-temp-humidity-probetemperature-battery
components:
- id: main
  capabilities:
  - id: temperatureMeasurement
    version: 1
  - id: relativeHumidityMeasurement
    version: 1
  # Probe Temperature (프로브 온도) - Custom capability
  - id: connectamber53538.probeTemperature
    version: 1
  - id: battery
    version: 1
  - id: firmwareUpdate
    version: 1
  - id: refresh
    version: 1
  - {id: signalStrength, version: 1}
  categories:
  - name: TempHumiditySensor
preferences:
  - preferenceId: tempOffset
    explicit: true
  - preferenceId: humidityOffset
    explicit: true
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: temperatureMeasurement
      group: main
      values:
      - label: '{{temperature.value}}{{temperature.unit}}'
      composite: true
    - component: main
      capability: relativeHumidityMeasurement
      group: main
      values:
      - label: ' {{humidity.value}}{{humidity.unit}}'
      composite: true
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: temperatureMeasurement
  - component: main
    capability: relativeHumidityMeasurement
  - component: main
    capability: connectamber53538.probeTemperature
  - component: main
    capability: battery
  - component: main
    capability: refresh
  - component: main
    capability: signalStrength
  automation:
    conditions:
    - component: main
      capability: temperatureMeasurement
    - component: main
      capability: relativeHumidityMeasurement
    - component: main
      capability: connectamber53538.probeTemperature
    - component: main
      capability: battery
    - component: main
      capability: signalStrength
    actions: []
