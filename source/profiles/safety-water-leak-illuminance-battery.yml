name: safety-water-leak-illuminance-battery
components:
  - id: main
    capabilities:
      - id: waterSensor
        version: 1
      - id: illuminanceMeasurement
        version: 1
      - id: battery
        version: 1
      - id: firmwareUpdate
        version: 1
      - id: refresh
        version: 1
      - {id: signalStrength, version: 1}
    categories:
      - name: LeakSensor
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: waterSensor
      group: main
    - component: main
      capability: illuminanceMeasurement
      values:
      - label: '{{illuminance.value}} {{illuminance.unit}}'
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: waterSensor
  - component: main
    capability: illuminanceMeasurement
  - component: main
    capability: battery
  - component: main
    capability: refresh
  - component: main
    capability: signalStrength
  automation:
    conditions:
    - component: main
      capability: waterSensor
    - component: main
      capability: illuminanceMeasurement
    - component: main
      capability: battery
    - component: main
      capability: signalStrength
    actions: []
