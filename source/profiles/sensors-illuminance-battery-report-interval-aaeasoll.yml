name: sensors-illuminance-battery-report-interval-aaeasoll
components:
  - id: main
    capabilities:
      - id: illuminanceMeasurement
        version: 1
      - id: battery
        version: 1
      - id: concertmirror08464.aaeasollReportInterval
        version: 1
      - id: firmwareUpdate
        version: 1
      - id: refresh
        version: 1
      - {id: signalStrength, version: 1}
    categories:
      - name: LightSensor
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: illuminanceMeasurement
      group: main
      values:
      - label: '{{illuminance.value}} {{illuminance.unit}}'
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: illuminanceMeasurement
  - component: main
    capability: battery
  - component: main
    capability: concertmirror08464.aaeasollReportInterval
  - component: main
    capability: refresh
  - component: main
    capability: signalStrength
  automation:
    conditions:
    - component: main
      capability: illuminanceMeasurement
    - component: main
      capability: battery
    - component: main
      capability: concertmirror08464.aaeasollReportInterval
    - component: main
      capability: signalStrength
    actions:
    - component: main
      capability: concertmirror08464.aaeasollReportInterval
