name: sensors-pressure-temp
components:
  - id: main
    capabilities:
      - id: atmosphericPressureMeasurement
        version: 1
      - id: temperatureMeasurement
        version: 1
      - id: firmwareUpdate
        version: 1
      - id: refresh
        version: 1
      - {id: signalStrength, version: 1}
    categories:
      - name: EnvironmentSensor
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: atmosphericPressureMeasurement
      group: main
      values:
      - label: '{{atmosphericPressure.value}} {{atmosphericPressure.unit}}'
      composite: true
    - component: main
      capability: temperatureMeasurement
      group: main
      values:
      - label: ' {{temperature.value}}{{temperature.unit}}'
      composite: true
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: atmosphericPressureMeasurement
  - component: main
    capability: temperatureMeasurement
  - component: main
    capability: refresh
  - component: main
    capability: signalStrength
  automation:
    conditions:
    - component: main
      capability: atmosphericPressureMeasurement
    - component: main
      capability: temperatureMeasurement
    - component: main
      capability: signalStrength
    actions: []
