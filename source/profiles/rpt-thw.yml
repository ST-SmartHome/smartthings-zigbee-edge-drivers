name: rpt-thw
components:
- id: main
  capabilities:
  - id: temperatureMeasurement
    version: 1
  - id: relativeHumidityMeasurement
    version: 1
  - id: battery
    version: 1
  - id: voltageMeasurement
    version: 1
  - id: firmwareUpdate
    version: 1
  - id: refresh
    version: 1
  - id: concertmirror08464.kctwDisplayUnit
    version: 1
  - id: signalStrength
    version: 1
  - id: concertmirror08464.zclBatteryReportMin
    version: 1
  - id: concertmirror08464.zclBatteryReportMax
    version: 1
  - id: concertmirror08464.zclBatteryReportChange20
    version: 1
  categories:
  - name: TempHumiditySensor
preferences:
- preferenceId: tempOffset
  explicit: true
- preferenceId: humidityOffset
  explicit: true
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: temperatureMeasurement
      group: main
      values:
      - label: '{{temperature.value}}{{temperature.unit}}'
      composite: true
    - component: main
      capability: relativeHumidityMeasurement
      group: main
      values:
      - label: ' {{humidity.value}}{{humidity.unit}}'
      composite: true
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: concertmirror08464.kctwDisplayUnit
  - component: main
    capability: temperatureMeasurement
  - component: main
    capability: relativeHumidityMeasurement
  - component: main
    capability: battery
  - component: main
    capability: voltageMeasurement
  - component: main
    capability: refresh
  - component: main
    capability: signalStrength
  - component: main
    capability: concertmirror08464.zclBatteryReportMin
  - component: main
    capability: concertmirror08464.zclBatteryReportMax
  - component: main
    capability: concertmirror08464.zclBatteryReportChange20
  automation:
    conditions:
    - component: main
      capability: concertmirror08464.kctwDisplayUnit
    - component: main
      capability: temperatureMeasurement
    - component: main
      capability: relativeHumidityMeasurement
    - component: main
      capability: battery
    - component: main
      capability: voltageMeasurement
    - component: main
      capability: signalStrength
    - component: main
      capability: concertmirror08464.zclBatteryReportMin
    - component: main
      capability: concertmirror08464.zclBatteryReportMax
    - component: main
      capability: concertmirror08464.zclBatteryReportChange20
    actions:
    - component: main
      capability: concertmirror08464.kctwDisplayUnit
    - component: main
      capability: concertmirror08464.zclBatteryReportMin
    - component: main
      capability: concertmirror08464.zclBatteryReportMax
    - component: main
      capability: concertmirror08464.zclBatteryReportChange20
