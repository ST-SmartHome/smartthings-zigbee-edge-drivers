      capability: concertmirror08464.moesZcHmCo
      values:
      - label: '{{co.value}} {{co.unit}}'
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: carbonMonoxideDetector
  - component: main
    capability: concertmirror08464.moesZcHmCo
  - component: main
    capability: battery
  - component: main
    capability: concertmirror08464.moesZcHmSelfTestResult
  - component: main
    capability: concertmirror08464.moesZcHmSilence
  - component: main
    capability: signalStrength
  automation:
    conditions:
    - component: main
      capability: carbonMonoxideDetector
    - component: main
      capability: concertmirror08464.moesZcHmCo
    - component: main
      capability: battery
    - component: main
      capability: concertmirror08464.moesZcHmSelfTestResult
    - component: main
      capability: concertmirror08464.moesZcHmSilence
    - component: main
      capability: signalStrength
    actions:
