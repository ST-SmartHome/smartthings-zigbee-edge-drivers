name: safety-co-moes-zc-hm
components:
  - id: main
    capabilities:
      - id: carbonMonoxideDetector
        version: 1
      - id: concertmirror08464.moesZcHmCo
        version: 1
      - id: battery
        version: 1
      - id: concertmirror08464.moesZcHmSelfTestResult
        version: 1
      - id: concertmirror08464.moesZcHmSilence
        version: 1
      - {id: signalStrength, version: 1}
